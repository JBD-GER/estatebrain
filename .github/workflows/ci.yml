name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Typecheck, Lint, Tests und Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: ESLint ausführen
        run: npm run lint

      - name: Tests ausführen
        run: npm run test

      - name: Produktions-Build erstellen
        run: npm run build

      - name: Chromium für Smoke-Tests installieren
        run: npx playwright install --with-deps chromium

      - name: Browser-Smoke-Tests ausführen
        run: npm run test:e2e -- --project=chromium
